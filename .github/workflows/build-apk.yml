name: Build Android APK

on:
  push:
    branches: [ "claude/thinkora-cognitive-platform-22g0za", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        working-directory: thinkora_app
        run: flutter create --platforms=android --org=com.thinkora .

      - name: Get dependencies
        working-directory: thinkora_app
        run: flutter pub get

      - name: Build APK (release)
        working-directory: thinkora_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thinkora-APK
          path: thinkora_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
